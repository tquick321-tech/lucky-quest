  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.3
  crypto: ^3.0.3
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  image_picker: ^1.0.7
  
  # Security
  local_auth: ^2.1.8
  
  # Testing
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
